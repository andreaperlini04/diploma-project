; Override di sviluppo per OPcache, caricato da conf.d dopo php.ini.
;
; php.ini imposta validate_timestamps=0: corretto in produzione, ma in sviluppo
; Apache continua a servire il bytecode del primo caricamento finché il
; container non viene riavviato. Non emerge dai test, che girano da CLI con
; OPcache disattivato: la suite può essere verde mentre il sito serve codice
; precedente.

opcache.validate_timestamps=1
opcache.revalidate_freq=0
